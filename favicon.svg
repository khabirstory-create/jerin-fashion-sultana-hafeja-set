<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Shopping Bag Handle -->
  <path d="M23 22 C23 11, 41 11, 41 22" fill="none" stroke="url(#handleGrad)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Shopping Bag Body -->
  <path d="M12 20 L52 20 L48 53 C47.8 55.5 45.8 57.5 43.3 57.5 L20.7 57.5 C18.2 57.5 16.2 55.5 16 53 Z" fill="url(#bagGrad)" filter="url(#shadow)" />
  
  <!-- Front Fold Line -->
  <path d="M13 20 L24 29 L40 29 L51 20" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.5" stroke-linecap="round" />
  
  <!-- Gold Shopping Deal / Star Badge -->
  <circle cx="43" cy="42" r="9" fill="url(#badgeGrad)" filter="url(#shadow)" />
  <path d="M43 37 L44.3 40.5 L48 40.5 L45 42.7 L46.2 46.2 L43 44 L39.8 46.2 L41 42.7 L38 40.5 L41.7 40.5 Z" fill="#ffffff" />
</svg>
