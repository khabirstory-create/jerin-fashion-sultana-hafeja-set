    <path d="M 33 26 L 45 26 L 45 30 L 38 30 L 38 34 L 43 34 L 43 38 L 38 38 L 38 46 L 33 46 Z" fill="url(#goldGrad)" />
    <circle cx="46" cy="18" r="3.5" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <text x="84" y="38" font-family="'Plus Jakarta Sans', 'Hind Siliguri', sans-serif" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="0.5">Jerin Fashion</text>
  <text x="86" y="56" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#0d9488" letter-spacing="1.5">PREMIUM HIJAB &amp; BORKA</text>
