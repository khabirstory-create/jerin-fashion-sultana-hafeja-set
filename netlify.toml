[[redirects]]
  from = "/sultana-hafeja-set"
  to = "/sultana-hafeja-set/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[context.production.environment]
  NETLIFY_TOOLBAR = "off"

[context.deploy-preview.environment]
  NETLIFY_TOOLBAR = "off"

[context.branch-deploy.environment]
  NETLIFY_TOOLBAR = "off"
